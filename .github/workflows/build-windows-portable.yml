name: "Build Portable - Windows"

# Builds a portable ZIP: extract it anywhere and run meetily.exe, no installer
# and no admin rights. A portable.txt marker next to the exe keeps all data
# (database, models, settings, recordings) in a "data" folder beside it.
#
# The build is compiled with the `local-only` feature: analytics, cloud LLM
# providers, remote endpoints and the auto-updater are disabled, so meeting
# content never leaves the PC.
#
# Needs no signing certificates or repository secrets, so it also runs on forks.

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: 'Transcription acceleration (cpu works on every PC; vulkan uses the GPU)'
        required: true
        type: choice
        options:
          - cpu
          - vulkan
        default: cpu
      include-models:
        description: 'Include transcription and summary models (ready to use offline, ~2 GB ZIP)'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-windows-portable:
    name: Build Windows portable (x64, ${{ github.event.inputs.gpu }})
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure portable native build
        shell: pwsh
        run: |
          # Avoid CPU-specific instructions so the exe runs on any x86-64 PC
          $cmakeHook = (Join-Path $env:GITHUB_WORKSPACE ".github/force-portable-ggml.cmake").Replace('\', '/')
          "CMAKE_PROJECT_INCLUDE=$cmakeHook" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTFLAGS=-C target-cpu=x86-64-v2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          prefix-key: windows-portable-zip-v1
          key: windows-x64-${{ github.event.inputs.gpu }}

      - name: Install Vulkan SDK
        if: ${{ github.event.inputs.gpu == 'vulkan' }}
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Build llama-helper sidecar
        shell: pwsh
        run: |
          cargo build --release -p llama-helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force -Path "frontend/src-tauri/binaries" | Out-Null
          Copy-Item "target/release/llama-helper.exe" -Destination "frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe"

      - name: Cache FFmpeg binary
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries/ffmpeg-*.exe
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('frontend/src-tauri/build.rs', 'frontend/src-tauri/build/ffmpeg.rs') }}

      - name: Cache Windows ONNX Runtime
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries/onnxruntime
          key: ${{ runner.os }}-onnxruntime-x86_64-pc-windows-msvc-${{ hashFiles('frontend/src-tauri/build/onnxruntime.rs') }}

      - name: Test speaker identification library
        run: cargo test -p speaker-id --release

      - name: Build Tauri app (no installer)
        shell: pwsh
        run: |
          cd frontend
          $features = "local-only"
          if ("${{ github.event.inputs.gpu }}" -eq "vulkan") { $features = "local-only,vulkan" }
          # --no-bundle skips MSI/NSIS creation, which needs signing and updater keys
          pnpm tauri build --target x86_64-pc-windows-msvc --no-bundle --features $features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify portable native code
        run: node .github/verify-portable-ggml.cjs target/x86_64-pc-windows-msvc/release

      - name: Assemble portable folder
        id: assemble
        shell: pwsh
        run: |
          $version = "${{ steps.get-version.outputs.version }}"
          $gpu = "${{ github.event.inputs.gpu }}"
          $name = "meetily-$version-windows-x64-portable-$gpu"
          $out = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $tauriDir = "frontend/src-tauri"
          $binaries = "$tauriDir/binaries"

          Copy-Item "target/x86_64-pc-windows-msvc/release/meetily.exe" -Destination $out

          # Sidecars: same names the installer gives them
          Copy-Item "$binaries/llama-helper-x86_64-pc-windows-msvc.exe" -Destination (Join-Path $out "llama-helper.exe")
          Copy-Item "$binaries/ffmpeg-x86_64-pc-windows-msvc.exe" -Destination (Join-Path $out "ffmpeg.exe")

          # Resources, mirroring tauri.windows.conf.json
          Copy-Item "$tauriDir/templates" -Destination (Join-Path $out "templates") -Recurse
          Copy-Item "$binaries/onnxruntime/*" -Destination $out -Recurse

          # Portable mode marker: keeps all data in .\data next to the exe
          Set-Content -Path (Join-Path $out "portable.txt") -Encoding utf8 -Value @(
            "Meetily portable mode.",
            "While this file sits next to meetily.exe, all data (database, models,",
            "settings, recordings) is stored in the 'data' folder beside it.",
            "Delete this file to use the normal per-user locations instead."
          )

          Copy-Item "docs/PORTABLE_WINDOWS.md" -Destination (Join-Path $out "LEGGIMI-PORTABLE.md")

          # Third-party license notices (required by MIT, GPL-3.0, Apache-2.0, CC-BY-4.0)
          Copy-Item "docs/portable-licenses/*" -Destination $out

          Write-Host "Portable folder contents:"
          Get-ChildItem $out -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

          foreach ($required in @("meetily.exe", "llama-helper.exe", "ffmpeg.exe", "onnxruntime.dll", "templates", "portable.txt")) {
            if (-not (Test-Path (Join-Path $out $required))) {
              Write-Error "Missing $required in portable folder"
              exit 1
            }
          }

          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "path=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Voice model for "who said what": small, always included
      - name: Add speaker identification model
        shell: pwsh
        run: |
          $target = Join-Path "${{ steps.assemble.outputs.path }}" "data/models/speaker/campplus.onnx"
          New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
          $url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx"
          curl.exe -fL --retry 5 --retry-delay 10 -o $target $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "357a834f702b80161e5b981182c038e18553c1f2ca752ed6cec2052365d4129b") {
            Write-Error "Unexpected speaker model checksum: $hash"
            exit 1
          }

      - name: Cache offline models
        if: ${{ github.event.inputs.include-models == 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models-cache
          key: offline-models-parakeet-v3-int8-qwen3.5-2b-q4km-v1

      # Same files and layout the app downloads on first run, so it starts with
      # nothing left to download (useful behind corporate proxies)
      - name: Add offline models
        if: ${{ github.event.inputs.include-models == 'true' }}
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "models-cache"
          $models = Join-Path "${{ steps.assemble.outputs.path }}" "data/models"

          function Get-Model($url, $fallbackUrl, $target, $minBytes, $maxBytes) {
            $cached = Join-Path $cache (Split-Path $target -Leaf)
            $ok = (Test-Path $cached) -and ((Get-Item $cached).Length -ge $minBytes) -and ((Get-Item $cached).Length -le $maxBytes)
            if (-not $ok) {
              New-Item -ItemType Directory -Force -Path $cache | Out-Null
              foreach ($source in @($url, $fallbackUrl) | Where-Object { $_ }) {
                Write-Host "Downloading $source"
                curl.exe -fL --retry 5 --retry-delay 10 -o $cached $source
                if ($LASTEXITCODE -eq 0) { break }
              }
              $size = (Get-Item $cached).Length
              if ($size -lt $minBytes -or $size -gt $maxBytes) {
                Write-Error "Unexpected size for $(Split-Path $target -Leaf): $size bytes"
                exit 1
              }
            }
            New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
            Copy-Item $cached -Destination $target
          }

          # Transcription: Parakeet TDT 0.6B v3 int8 (sizes from parakeet_engine.rs)
          $parakeetDir = Join-Path $models "parakeet/parakeet-tdt-0.6b-v3-int8"
          $parakeetBase = "https://meetily.towardsgeneralintelligence.com/models/parakeet-tdt-0.6b-v3-onnx"
          $parakeetMirror = "https://huggingface.co/istupakov/parakeet-tdt-0.6b-v3-onnx/resolve/main"
          $parakeetFiles = @{
            "encoder-model.int8.onnx"       = 652183999
            "decoder_joint-model.int8.onnx" = 18202004
            "nemo128.onnx"                  = 139764
            "vocab.txt"                     = 93939
          }
          foreach ($file in $parakeetFiles.Keys) {
            $bytes = $parakeetFiles[$file]
            Get-Model "$parakeetBase/$file" "$parakeetMirror/$file" (Join-Path $parakeetDir $file) $bytes $bytes
          }

          # Summaries: Qwen 3.5 2B Q4_K_M, the default built-in model (size_mb 1221, app accepts +/-10%)
          $qwenUrl = "https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf"
          Get-Model $qwenUrl $null (Join-Path $models "summary/Qwen3.5-2B-Q4_K_M.gguf") (1100MB) (1343MB)

          Get-ChildItem $models -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

      # Lets you check on the work PC that no file was altered after the build
      - name: Write checksums
        shell: pwsh
        run: |
          $out = "${{ steps.assemble.outputs.path }}"
          Get-ChildItem $out -Recurse -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $([IO.Path]::GetRelativePath($out, $_.FullName))"
            } | Set-Content -Path (Join-Path $out "SHA256SUMS.txt") -Encoding utf8

      # upload-artifact zips the folder: the downloaded file is the portable ZIP
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.assemble.outputs.name }}
          path: ${{ steps.assemble.outputs.path }}
          retention-days: 30
          # Models are already compressed: skip recompressing ~2 GB
          compression-level: 1

      - name: Build summary
        shell: bash
        run: |
          echo "## Meetily portable for Windows" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the **${{ steps.assemble.outputs.name }}** artifact below, extract it and run \`meetily.exe\`." >> $GITHUB_STEP_SUMMARY
